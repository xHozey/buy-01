services:
  server:
    hostname: server
    build: ./server
    ports:
      - "8761:8761"
    depends_on:
      - mongodb

  user:
    hostname: user
    build: ./userService
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-userDB}
    ports:
      - "8081:8081"
    depends_on:
      - server

  product:
    hostname: product
    build: ./productService
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-productDB}
    ports:
      - "8082:8082"
    depends_on:
      - server
      - broker

  media:
    hostname: media
    build: ./mediaService
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-mediaDB}
    ports:
      - "8083:8083"
    depends_on:
      - server
      - broker

  gateway:
    hostname: gatewat
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
      - user
      - product
      - media

  mongodb:
    image: mongo:7.0
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db

  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
