
services:
  server:
    build: ./server
    ports:
      - "8761:8761"

  user:
    build: ./userService
    ports:
      - "8081:8081"
    depends_on:
      - server

  product:
    build: ./productService
    ports:
      - "8082:8082"
    depends_on:
      - server

  media:
    build: ./mediaService
    ports:
      - "8083:8083"
    depends_on:
      - server

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
      - user
      - product
      - media
