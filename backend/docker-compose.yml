services:
  server:
    hostname: server
    build: ./server
    ports:
      - "8761:8761"
    depends_on:
      - mongodb

  user:
    hostname: user
    build: ./userService
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-userDB}
    ports:
      - "8081:8081"
    depends_on:
      - server

  product:
    hostname: product
    build: ./productService
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-productDB}
    ports:
      - "8082:8082"
    depends_on:
      - server

  media:
    hostname: media
    build: ./mediaService
    environment:
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://admin:password@mongodb:27017/?authSource=admin}
      SPRING_MONGODB_DATABASE: ${SPRING_MONGODB_DATABASE:-mediaDB}
    ports:
      - "8083:8083"
    depends_on:
      - server

  gateway:
    hostname: gatewat
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
      - user
      - product
      - media

  mongodb:
    image: mongo:7.0
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
