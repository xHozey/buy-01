services:
  server:
    hostname: server
    build: ./server
    ports:
      - "8761:8761"
    depends_on:
      - mongodb

  user:
    hostname: user
    build: ./userService
    ports:
      - "8081:8081"
    depends_on:
      - server

  product:
    hostname: product
    build: ./productService
    ports:
      - "8082:8082"
    depends_on:
      - server

  media:
    hostname: media
    build: ./mediaService
    ports:
      - "8083:8083"
    depends_on:
      - server

  gateway:
    hostname: gatewat
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - server
      - user
      - product
      - media

  mongodb:
    image: mongo:7.0
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
