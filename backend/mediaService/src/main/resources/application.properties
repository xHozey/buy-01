spring.application.name=mediaService
server.port=8083

eureka.client.service-url.defaultZone=http://server:8761/eureka/

spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=mediaDB

management.endpoints.web.exposure.include=health

spring.kafka.bootstrap-servers=broker:9092
spring.kafka.consumer.group-id=media-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

cloudinary.cloud_name=dnlkukgdp
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
