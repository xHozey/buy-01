spring.application.name=mediaService
server.port=8083

eureka.client.service-url.defaultZone=http://server:8761/eureka/
spring.mongodb.uri=mongodb://admin:password@mongodb:27017/?authSource=admin
spring.mongodb.database=mediaDB
management.endpoints.web.exposure.include=health

spring.kafka.bootstrap-servers=broker:9092
spring.kafka.consumer.group-id=media-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

media.storage.endpoint=${MEDIA_STORAGE_ENDPOINT:http://rustfs:9000}
media.storage.access-key=${MEDIA_STORAGE_ACCESS_KEY:rustfsadmin}
media.storage.secret-key=${MEDIA_STORAGE_SECRET_KEY:rustfsadmin}
media.storage.bucket=${MEDIA_STORAGE_BUCKET:media}