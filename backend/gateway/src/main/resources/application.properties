spring.application.name=gateway
server.port=8080

eureka.client.service-url.defaultZone=http://server:8761/eureka/

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://userService
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://productService
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**

spring.cloud.gateway.routes[2].id=media-service
spring.cloud.gateway.routes[2].uri=lb://mediaService
spring.cloud.gateway.routes[2].predicates[0]=Path=/media/**