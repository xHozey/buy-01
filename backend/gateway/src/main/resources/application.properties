spring.application.name=gateway
server.port=8080

eureka.client.service-url.defaultZone=http://server:8761/eureka/

jwt.secret=buy01-user-service-jwt-secret-key-change-me-2026

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://userService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://productService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=media-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://mediaService
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/media/**