services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -eu;
        if [ ! -f /var/jenkins_home/.jenkins-plugins-installed ]; then
          jenkins-plugin-cli --plugin-file /usr/share/jenkins/ref/plugins.txt --plugin-download-directory /var/jenkins_home/plugins;
          touch /var/jenkins_home/.jenkins-plugins-installed;
        fi;
        exec /usr/bin/tini -- /usr/local/bin/jenkins.sh
    ports:
      - "8079:8080"
      - "50000:50000"
    env_file:
      - .env
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro

volumes:
  jenkins_home:
