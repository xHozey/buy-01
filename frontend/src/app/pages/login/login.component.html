<main class="auth-page">
  <section class="auth-aside">
    <a class="brand" routerLink="/">BUY<span>.</span></a>
    <div class="aside-copy">
      <p class="eyebrow">YOUR MARKETPLACE, REFINED</p>
      <h1>Good things<br /><em>find</em> their people.</h1>
      <p class="aside-note">A considered place to discover objects with a story and sellers worth knowing.</p>
    </div>
    <p class="aside-footer">01 <span></span> 04</p>
  </section>

  <section class="auth-panel">
    <div class="form-wrap">
      <p class="eyebrow">WELCOME BACK</p>
      <h2>Sign in</h2>
      <p class="form-intro">Pick up where you left off.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          Email address
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
          @if (form.controls.email.touched && form.controls.email.invalid) {<small>Enter a valid email address.</small>}
        </label>

        <label>
          Password
          <input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
          @if (form.controls.password.touched && form.controls.password.invalid) {<small>Use at least 6 characters.</small>}
        </label>

        @if (errorMessage) {<p class="error" role="alert">{{ errorMessage }}</p>}
        <button type="submit" [disabled]="submitting">{{ submitting ? 'Signing in...' : 'Sign in' }} <span>↗</span></button>
      </form>

      <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
    </div>
  </section>
</main>
