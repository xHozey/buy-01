<main class="auth-page register-page">
  <section class="auth-aside">
    <a class="brand" routerLink="/">BUY<span>.</span></a>
    <div class="aside-copy">
      <p class="eyebrow">MAKE YOUR MARK</p>
      <h1>Find your<br /><em>corner</em> of BUY.</h1>
      <p class="aside-note">Join a community of curious buyers and independent sellers.</p>
    </div>
    <p class="aside-footer">02 <span></span> 04</p>
  </section>

  <section class="auth-panel">
    <div class="form-wrap">
      <p class="eyebrow">GET STARTED</p>
      <h2>Create account</h2>
      <p class="form-intro">It only takes a minute to get inside.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          Your name
          <input type="text" formControlName="name" autocomplete="name" placeholder="What should we call you?" />
          <small *ngIf="form.controls.name.touched && form.controls.name.invalid">Use at least 3 characters.</small>
        </label>

        <label>
          Email address
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
          <small *ngIf="form.controls.email.touched && form.controls.email.invalid">Enter a valid email address.</small>
        </label>

        <label>
          Password
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="At least 6 characters" />
          <small *ngIf="form.controls.password.touched && form.controls.password.invalid">Use at least 6 characters.</small>
        </label>

        <fieldset>
          <legend>I am joining as</legend>
          <label class="role-option"><input type="radio" formControlName="role" value="CLIENT" /> <span>Buyer</span></label>
          <label class="role-option"><input type="radio" formControlName="role" value="SELLER" /> <span>Seller</span></label>
        </fieldset>

        <p class="error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
        <button type="submit" [disabled]="submitting">{{ submitting ? 'Creating...' : 'Create account' }} <span>↗</span></button>
      </form>

      <p class="switch">Already a member? <a routerLink="/login">Sign in</a></p>
    </div>
  </section>
</main>
